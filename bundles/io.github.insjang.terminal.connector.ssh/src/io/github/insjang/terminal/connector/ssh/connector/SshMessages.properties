# NLS_MESSAGEFORMAT_VAR

HOST = Host
USER = User
PORT = Port
PASSWORD = Password
TIMEOUT = Timeout (sec)
KEEPALIVE = KeepAlive (sec)
KEEPALIVE_Tooltip=Interval for sending keepalive messages in case of inactivity. Enter 0 to disable keepalives.
KEY_FILE = Key file
KEY_FILE_Tooltip=Private key tried before the default ~/.ssh keys. Leave empty for the defaults only.
KEY_FILE_NOT_FOUND=The key file does not exist.
START_FOLDER = Start folder
START_FOLDER_Tooltip=Folder the shell and the Files view start in after login (~ for the home). Leave empty for the home.
BROWSE = Browse...
WARNING = Warning
INFO = Info

